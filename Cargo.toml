[package]
name = "pcapng-mcp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# MCP SDK
rmcp = { version = "0.3.2", features = ["server", "macros", "transport-io"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# PcapNG Parsing
pcap-parser = "0.17.0"
pcap-file = "2.0.0"

# Additional utilities
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

[lib]
name = "pcapng_mcp_server"
path = "src/lib.rs"

[[bin]]
name = "pcapng-mcp-server"
path = "src/main.rs"
